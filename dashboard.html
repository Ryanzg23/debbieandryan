<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>Planning Dashboard — Ryan &amp; Debbie</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%236e1b2c'/%3E%3Cpath d='M32 50C14 38 10 28 10 21.5 10 15.7 14.7 11 20.5 11 25 11 29 13.6 32 18 35 13.6 39 11 43.5 11 49.3 11 54 15.7 54 21.5 54 28 50 38 32 50Z' fill='%23ffffff'/%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#ffffff;--blush:#fbf4f5;--blush-deep:#f1dee1;--rose:#9a3b48;--rose-soft:#e0bfc4;
  --gold:#b89150;--gold-deep:#997636;--burgundy:#6e1b2c;--burgundy-deep:#511320;
  --ink:#3f2429;--ink-soft:#7d5c61;--line:#ecdce0;--white:#fff;
  --shadow:0 18px 50px -24px rgba(81,19,32,.35);--radius:18px;
  --display:"Cormorant Garamond",Georgia,serif;--body:"Jost",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{overflow-x:hidden;scrollbar-color:var(--burgundy) var(--blush);scrollbar-width:thin}
::-webkit-scrollbar{width:12px;height:12px}
::-webkit-scrollbar-track{background:var(--blush)}
::-webkit-scrollbar-thumb{background:linear-gradient(var(--burgundy),var(--burgundy-deep));border-radius:10px;border:3px solid var(--blush)}
body{margin:0;font-family:var(--body);font-weight:300;color:var(--ink);background:var(--cream);overflow-x:hidden}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;color:var(--ink)}
.btn{display:inline-flex;align-items:center;gap:.5em;cursor:pointer;border:none;font-family:var(--body);font-weight:500;letter-spacing:.12em;text-transform:uppercase;font-size:12.5px;padding:12px 24px;border-radius:999px;transition:.22s}
.btn-primary{background:var(--burgundy);color:#fff}
.btn-primary:hover{background:var(--burgundy-deep)}
.btn-ghost{background:transparent;color:var(--burgundy);border:1.5px solid var(--burgundy)}
.btn-ghost:hover{background:var(--burgundy);color:#fff}

/* GATE */
.gate{position:fixed;inset:0;z-index:200;background:linear-gradient(135deg,#fbf4f5,#f1dee1);display:flex;align-items:center;justify-content:center;padding:24px}
.gate.hide{display:none}
.gate-box{background:#fff;border-radius:var(--radius);padding:44px 38px;max-width:390px;width:100%;text-align:center;box-shadow:var(--shadow);border-top:4px solid var(--burgundy)}
.gate-box .ico{font-size:34px;color:var(--gold);margin-bottom:10px}
.gate-box h3{font-size:1.9rem;color:var(--burgundy);margin-bottom:6px}
.gate-box p{color:var(--ink-soft);font-size:14px;margin-bottom:20px}
.gate-box input{width:100%;padding:13px 16px;border:1px solid var(--line);border-radius:12px;font-size:16px;text-align:center;letter-spacing:.1em;margin-bottom:14px;font-family:var(--body)}
.gate-box input:focus{outline:none;border-color:var(--burgundy)}
.gate-box .err{color:#b1443a;font-size:13px;margin-bottom:10px;min-height:18px}
.gate-box a.back{display:inline-block;margin-top:16px;font-size:12px;color:var(--ink-soft);text-decoration:none}
.gate-box a.back:hover{color:var(--burgundy)}

/* DASHBOARD */
#dash{display:none}
#dash.show{display:block}
.dash-top{position:sticky;top:0;background:rgba(255,253,251,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);z-index:5}
.dash-top .in{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 24px;max-width:1240px;margin:0 auto;flex-wrap:wrap}
.dash-top h2{font-size:26px}
.dash-top .live{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#2f7d4f;display:inline-flex;align-items:center;gap:6px}
.dash-top .live .d{width:8px;height:8px;border-radius:50%;background:#43b572;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
.dash-wrap{max-width:1240px;margin:0 auto;padding:28px 24px 80px}
.tabs{display:flex;gap:8px;margin-bottom:24px;flex-wrap:wrap}
.tab{padding:10px 22px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:var(--body);font-size:13px;letter-spacing:.08em;color:var(--ink);transition:.2s}
.tab.active{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:22px}
.toolbar input.search{flex:1;min-width:200px;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-family:var(--body);font-size:15px}
.toolbar input.search:focus{outline:none;border-color:var(--burgundy)}
.side-toggle{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:#fff}
.side-toggle button{border:none;background:none;padding:11px 22px;cursor:pointer;font-family:var(--body);font-size:13px;color:var(--ink-soft);transition:.2s}
.side-toggle button.on{background:var(--burgundy);color:#fff;font-weight:500}
.stat-pill{font-size:12px;color:var(--ink-soft);letter-spacing:.06em}
.cat-group{margin-bottom:26px}
.cat-group h4{display:flex;align-items:center;gap:10px;font-size:20px;margin-bottom:12px;color:var(--burgundy)}
.cat-group h4 .count{font-family:var(--body);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#fff;background:var(--burgundy);padding:3px 10px;border-radius:999px}
.g-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.guest-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 16px;background:#fff;border:1px solid var(--line);border-radius:12px}
.guest-row .nm{font-size:16px}
.guest-row .acts{display:flex;gap:8px;opacity:0;transition:.2s}
.guest-row:hover .acts{opacity:1}
.icon-btn{border:none;background:var(--blush);color:var(--ink-soft);width:34px;height:34px;border-radius:9px;cursor:pointer;font-size:14px;transition:.2s}
.icon-btn:hover{background:var(--rose-soft);color:var(--burgundy)}
.icon-btn.del:hover{background:#f3c7c1;color:#b1443a}
.check-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:#fff;border:1px solid var(--line);border-radius:12px;margin-bottom:8px}
.check-row input[type=checkbox]{width:20px;height:20px;accent-color:var(--burgundy);cursor:pointer}
.check-row .it{flex:1;font-size:16px}
.check-row.done .it{text-decoration:line-through;color:var(--ink-soft)}
.check-row .acts{display:flex;gap:8px;opacity:0;transition:.2s}
.check-row:hover .acts{opacity:1}
.empty{color:var(--ink-soft);font-style:italic;padding:30px;text-align:center}
/* RSVP */
.rsvp-summary{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-bottom:26px}
.rstat{background:linear-gradient(180deg,#fff,#fdf4f5);border:1px solid var(--line);border-top:3px solid var(--burgundy);border-radius:14px;padding:18px;text-align:center}
.rstat .n{font-family:var(--display);font-size:36px;color:var(--burgundy);line-height:1}
.rstat .l{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-top:6px}
.rsvp-item{background:#fff;border:1px solid var(--line);border-left:4px solid #43b572;border-radius:12px;padding:15px 18px;margin-bottom:10px}
.rsvp-item.no{border-left-color:#d08a84}
.ri-main{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
.ri-name{font-size:18px;font-family:var(--display);color:var(--ink)}
.ri-badge{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 12px;border-radius:999px;background:#e7f5ec;color:#2f7d4f}
.rsvp-item.no .ri-badge{background:#f6e0de;color:#b1443a}
.ri-meta{display:flex;gap:16px;flex-wrap:wrap;margin-top:8px;font-size:14px;color:var(--ink-soft)}
.ri-msg{margin-top:10px;font-style:italic;color:var(--ink);background:var(--blush);padding:10px 14px;border-radius:10px;font-size:15px}

/* MODAL */
.modal-overlay{position:fixed;inset:0;z-index:300;background:rgba(63,36,41,.55);backdrop-filter:blur(4px);display:none;align-items:center;justify-content:center;padding:24px}
.modal-overlay.open{display:flex}
.modal-box{background:#fff;border-radius:var(--radius);padding:32px 30px;max-width:430px;width:100%;box-shadow:var(--shadow);border-top:4px solid var(--burgundy);animation:popin .25s ease}
@keyframes popin{from{opacity:0;transform:translateY(10px) scale(.98)}to{opacity:1;transform:none}}
.modal-box h3{font-size:1.7rem;color:var(--burgundy);margin-bottom:4px}
.modal-box .m-sub{color:var(--ink-soft);font-size:14px;margin-bottom:8px}
.modal-box label{display:block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin:16px 0 6px}
.modal-box input,.modal-box select{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;font-family:var(--body);font-size:16px;background:var(--cream);color:var(--ink)}
.modal-box input:focus,.modal-box select:focus{outline:none;border-color:var(--burgundy)}
.modal-box .m-side{display:flex;gap:8px;margin-top:6px}
.modal-box .m-side button{flex:1;padding:11px;border:1px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;font-family:var(--body);font-size:13px;color:var(--ink-soft)}
.modal-box .m-side button.on{background:var(--burgundy);color:#fff;border-color:var(--burgundy)}
.modal-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:26px}

/* TOAST */
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--burgundy);color:#fff;padding:13px 24px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:400}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:820px){
  .dash-top .in{padding:14px 16px}
  .dash-top h2{font-size:19px}
  .dash-top .in>div{width:100%;justify-content:flex-start}
  .dash-top .btn{padding:9px 14px;font-size:11px}
  .dash-wrap{padding:20px 14px 70px}
  .side-toggle{width:100%}
  .side-toggle button{flex:1;padding:11px 6px;font-size:11.5px}
  .toolbar input.search{min-width:0;width:100%}
  .toolbar .btn{width:100%;justify-content:center}
  .g-grid{grid-template-columns:1fr}
  .rsvp-summary{grid-template-columns:1fr 1fr}
}
@media(hover:none){ .guest-row .acts,.check-row .acts{opacity:1} }
</style>
</head>
<body>

<!-- GATE -->
<div class="gate" id="gate">
  <div class="gate-box">
    <div class="ico">⚜</div>
    <h3>Planning Dashboard</h3>
    <p>This area is for the couple. Please enter the passphrase.</p>
    <input type="password" id="gate-input" placeholder="Passphrase" autocomplete="off" />
    <div class="err" id="gate-err"></div>
    <button class="btn btn-primary" id="gate-go" style="width:100%">Enter</button>
    <a class="back" href="index.html">← Back to site</a>
  </div>
</div>

<!-- DASHBOARD -->
<div id="dash">
  <div class="dash-top">
    <div class="in">
      <h2>Planning Dashboard <span class="live"><span class="d"></span>Live</span></h2>
      <div style="display:flex;gap:10px;flex-wrap:wrap">
        <button class="btn btn-ghost" id="export-btn">↓ Export Guests</button>
        <a class="btn btn-ghost" href="index.html">← Back to site</a>
      </div>
    </div>
  </div>
  <div class="dash-wrap">
    <div class="tabs">
      <button class="tab active" data-view="guests">Guest List</button>
      <button class="tab" data-view="checklist">Checklist</button>
      <button class="tab" data-view="rsvps">RSVPs</button>
    </div>

    <!-- GUESTS -->
    <div id="view-guests">
      <div class="toolbar">
        <div class="side-toggle">
          <button data-side="groom" class="on">🤵 Ryan's Guests <span id="cnt-groom"></span></button>
          <button data-side="bride">👰 Debbie's Guests <span id="cnt-bride"></span></button>
        </div>
        <input class="search" id="guest-search" placeholder="Search guests…" />
        <button class="btn btn-primary" id="add-guest-btn">+ Add Guest</button>
        <span class="stat-pill" id="guest-total"></span>
      </div>
      <div id="guest-groups"></div>
    </div>

    <!-- CHECKLIST -->
    <div id="view-checklist" style="display:none">
      <div class="toolbar">
        <div class="side-toggle" id="cl-sides">
          <button data-cside="wedding" class="on">💍 Wedding</button>
          <button data-cside="groom">🤵 Ryan</button>
          <button data-cside="bride">👰 Debbie</button>
        </div>
        <button class="btn btn-primary" id="add-item-btn">+ Add Item</button>
        <span class="stat-pill" id="cl-progress"></span>
      </div>
      <div id="checklist-items"></div>
    </div>

    <!-- RSVPS -->
    <div id="view-rsvps" style="display:none">
      <div class="rsvp-summary" id="rsvp-summary"></div>
      <div id="rsvp-list"></div>
    </div>
  </div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal-box">
    <h3 id="modal-title"></h3>
    <div class="m-sub" id="modal-sub" style="display:none"></div>
    <div id="modal-body"></div>
    <div class="modal-actions">
      <button class="btn btn-ghost" id="modal-cancel">Cancel</button>
      <button class="btn btn-primary" id="modal-ok">Save</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const CONFIG = {
  dashboardPassphrase: "forever",
  supabaseUrl: "https://vbtczoxnojyytrxpoamc.supabase.co",
  supabaseKey: "sb_publishable_FWqACVDuh0UmKB2tKWy9Sg_fEB5hofS"
};
</script>
<script>
(function(){
  "use strict";
  const $=(s,el=document)=>el.querySelector(s);
  const $$=(s,el=document)=>[...el.querySelectorAll(s)];
  const esc=s=>(s==null?"":String(s)).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  const CATEGORIES=["My Parents","Best Man","Maid of Honor","Groomsmen","Bridesmaids","Ring Bearer","Flower Girl","Attendees","Friends","Workmate","God Mother / Father"];
  const CAT_ICON={"My Parents":"♡","Best Man":"♔","Maid of Honor":"♕","Groomsmen":"♢","Bridesmaids":"❀","Ring Bearer":"◌","Flower Girl":"✿","Attendees":"✦","Friends":"♡","Workmate":"✦","God Mother / Father":"❦"};
  let sb=null, guests=[], checklist=[], rsvps=[], curSide="groom", curCSide="wedding", started=false;

  /* ---------- TOAST ---------- */
  const toast=$("#toast"); let toastT;
  function showToast(m){ toast.textContent=m; toast.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(()=>toast.classList.remove("show"),2600); }

  /* ---------- MODAL ---------- */
  const modal=$("#modal");
  let modalResolver=null;
  function closeModal(val){ modal.classList.remove("open"); const r=modalResolver; modalResolver=null; if(r) r(val); }
  $("#modal-cancel").addEventListener("click",()=>closeModal(null));
  modal.addEventListener("click",e=>{ if(e.target===modal) closeModal(null); });
  document.addEventListener("keydown",e=>{ if(e.key==="Escape"&&modal.classList.contains("open")) closeModal(null); });

  function promptModal({title, sub, label, value="", okText="Save"}){
    return new Promise(res=>{
      modalResolver=res;
      $("#modal-title").textContent=title;
      const subEl=$("#modal-sub"); if(sub){subEl.style.display="";subEl.textContent=sub;}else subEl.style.display="none";
      $("#modal-body").innerHTML=`<label>${esc(label||"Name")}</label><input id="m-input" value="${esc(value)}" />`;
      $("#modal-ok").textContent=okText;
      modal.classList.add("open");
      const inp=$("#m-input"); setTimeout(()=>{inp.focus();inp.select();},50);
      inp.addEventListener("keydown",e=>{ if(e.key==="Enter") doOk(); });
      $("#modal-ok").onclick=doOk;
      function doOk(){ const v=inp.value.trim(); if(!v) return; closeModal(v); }
    });
  }
  function confirmModal({title, sub, okText="Delete"}){
    return new Promise(res=>{
      modalResolver=res;
      $("#modal-title").textContent=title;
      const subEl=$("#modal-sub"); if(sub){subEl.style.display="";subEl.textContent=sub;}else subEl.style.display="none";
      $("#modal-body").innerHTML="";
      $("#modal-ok").textContent=okText;
      modal.classList.add("open");
      $("#modal-ok").onclick=()=>closeModal(true);
    });
  }
  function addGuestModal(){
    return new Promise(res=>{
      modalResolver=res;
      let side=curSide;
      $("#modal-title").textContent="Add a Guest";
      $("#modal-sub").style.display="none";
      $("#modal-body").innerHTML=`
        <label>Full name</label>
        <input id="m-name" placeholder="Guest name" />
        <label>Side</label>
        <div class="m-side" id="m-side">
          <button type="button" data-s="groom" class="${side==='groom'?'on':''}">🤵 Ryan's</button>
          <button type="button" data-s="bride" class="${side==='bride'?'on':''}">👰 Debbie's</button>
        </div>
        <label>Category</label>
        <select id="m-cat">${CATEGORIES.map(c=>`<option value="${esc(c)}">${esc(c)}</option>`).join("")}</select>`;
      $("#modal-ok").textContent="Add Guest";
      modal.classList.add("open");
      const nameI=$("#m-name"); setTimeout(()=>nameI.focus(),50);
      $$("#m-side button").forEach(b=>b.addEventListener("click",()=>{ side=b.dataset.s; $$("#m-side button").forEach(x=>x.classList.toggle("on",x===b)); }));
      nameI.addEventListener("keydown",e=>{ if(e.key==="Enter") doOk(); });
      $("#modal-ok").onclick=doOk;
      function doOk(){ const name=nameI.value.trim(); if(!name) return; closeModal({name, side, category:$("#m-cat").value}); }
    });
  }

  /* ---------- SUPABASE ---------- */
  function initSupabase(){
    try{ sb=window.supabase.createClient(CONFIG.supabaseUrl, CONFIG.supabaseKey); return true; }
    catch(e){ console.error(e); return false; }
  }

  /* ---------- GATE ---------- */
  const gate=$("#gate"), dash=$("#dash");
  function unlock(){ gate.classList.add("hide"); dash.classList.add("show"); start(); }
  function tryGate(){
    if($("#gate-input").value===CONFIG.dashboardPassphrase){
      try{ sessionStorage.setItem("rd_dash","1"); }catch(e){}
      $("#gate-err").textContent=""; unlock();
    }else $("#gate-err").textContent="That's not quite right.";
  }
  $("#gate-go").addEventListener("click",tryGate);
  $("#gate-input").addEventListener("keydown",e=>{ if(e.key==="Enter") tryGate(); });
  let already=false; try{ already=sessionStorage.getItem("rd_dash")==="1"; }catch(e){}
  if(already) unlock(); else setTimeout(()=>$("#gate-input").focus(),100);

  /* ---------- START ---------- */
  async function start(){
    if(started) return; started=true;
    if(!initSupabase()){ $("#guest-groups").innerHTML=`<div class="empty">Could not connect to Supabase.</div>`; return; }
    await Promise.all([loadGuests(), loadChecklist(), loadRsvps()]);
    subscribeRealtime();
  }

  /* ---------- TABS ---------- */
  $$(".tab").forEach(t=>t.addEventListener("click",()=>{
    $$(".tab").forEach(x=>x.classList.remove("active")); t.classList.add("active");
    const v=t.dataset.view;
    $("#view-guests").style.display=v==="guests"?"":"none";
    $("#view-checklist").style.display=v==="checklist"?"":"none";
    $("#view-rsvps").style.display=v==="rsvps"?"":"none";
  }));

  /* ---------- GUESTS ---------- */
  async function loadGuests(){
    const {data,error}=await sb.from("guests").select("id,name,category,guest_side,created_at,updated_at").order("category").order("name");
    if(error){ $("#guest-groups").innerHTML=`<div class="empty">Couldn't load guests: ${esc(error.message)}</div>`; return; }
    guests=data||[]; renderGuests();
  }
  function renderGuests(){
    const q=($("#guest-search").value||"").toLowerCase().trim();
    $("#cnt-groom").textContent=guests.filter(g=>g.guest_side==="groom").length;
    $("#cnt-bride").textContent=guests.filter(g=>g.guest_side==="bride").length;
    let list=guests.filter(g=>g.guest_side===curSide);
    if(q) list=list.filter(g=>g.name.toLowerCase().includes(q));
    $("#guest-total").textContent=`${list.length} guest${list.length!==1?"s":""}`;
    const byCat={}; list.forEach(g=>{ (byCat[g.category]=byCat[g.category]||[]).push(g); });
    const order=CATEGORIES.filter(c=>byCat[c]).concat(Object.keys(byCat).filter(c=>!CATEGORIES.includes(c)));
    if(!list.length){ $("#guest-groups").innerHTML=`<div class="empty">No guests${q?" match your search":" on this side yet"}.</div>`; return; }
    $("#guest-groups").innerHTML=order.map(cat=>`
      <div class="cat-group">
        <h4>${CAT_ICON[cat]||"✦"} ${esc(cat)} <span class="count">${byCat[cat].length}</span></h4>
        <div class="g-grid">
        ${byCat[cat].map(g=>`
          <div class="guest-row" data-id="${g.id}">
            <span class="nm">${esc(g.name)}</span>
            <span class="acts">
              <button class="icon-btn edit" title="Rename">✎</button>
              <button class="icon-btn del" title="Remove">✕</button>
            </span>
          </div>`).join("")}
        </div>
      </div>`).join("");
  }
  $("#guest-search").addEventListener("input",renderGuests);
  $$("#view-guests .side-toggle button").forEach(b=>b.addEventListener("click",()=>{
    $$("#view-guests .side-toggle button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    curSide=b.dataset.side; renderGuests();
  }));
  $("#add-guest-btn").addEventListener("click",async()=>{
    const res=await addGuestModal(); if(!res) return;
    const {error}=await sb.from("guests").insert({name:res.name,category:res.category,guest_side:res.side});
    if(error){ showToast("Error: "+error.message); return; }
    showToast(`${res.name} added`); if(res.side!==curSide){ curSide=res.side; $$("#view-guests .side-toggle button").forEach(x=>x.classList.toggle("on",x.dataset.side===curSide)); }
    loadGuests();
  });
  $("#guest-groups").addEventListener("click",async e=>{
    const row=e.target.closest(".guest-row"); if(!row) return;
    const id=row.dataset.id, g=guests.find(x=>String(x.id)===String(id)); if(!g) return;
    if(e.target.classList.contains("del")){
      const ok=await confirmModal({title:"Remove guest?",sub:`${g.name} will be removed from the list.`,okText:"Remove"});
      if(!ok) return;
      const {error}=await sb.from("guests").delete().eq("id",id);
      if(error){ showToast("Error: "+error.message); return; }
      showToast("Removed"); loadGuests();
    }
    if(e.target.classList.contains("edit")){
      const nn=await promptModal({title:"Rename guest",label:"Full name",value:g.name,okText:"Save"});
      if(nn==null) return;
      const {error}=await sb.from("guests").update({name:nn,updated_at:new Date()}).eq("id",id);
      if(error){ showToast("Error: "+error.message); return; }
      showToast("Renamed"); loadGuests();
    }
  });

  /* ---------- CHECKLIST ---------- */
  async function loadChecklist(){
    const {data,error}=await sb.from("wedding_checklist").select("id,side,item,completed,sort_order,updated_at").order("side").order("sort_order");
    if(error){ $("#checklist-items").innerHTML=`<div class="empty">Couldn't load checklist: ${esc(error.message)}</div>`; return; }
    checklist=data||[]; renderChecklist();
  }
  function renderChecklist(){
    const list=checklist.filter(c=>c.side===curCSide);
    const done=list.filter(c=>c.completed).length;
    $("#cl-progress").textContent=list.length?`${done} of ${list.length} done`:"";
    if(!list.length){ $("#checklist-items").innerHTML=`<div class="empty">No items yet. Add one above.</div>`; return; }
    $("#checklist-items").innerHTML=list.map(c=>`
      <div class="check-row ${c.completed?'done':''}" data-id="${c.id}">
        <input type="checkbox" ${c.completed?"checked":""}>
        <span class="it">${esc(c.item)}</span>
        <span class="acts"><button class="icon-btn del" title="Remove">✕</button></span>
      </div>`).join("");
  }
  $$("#cl-sides button").forEach(b=>b.addEventListener("click",()=>{
    $$("#cl-sides button").forEach(x=>x.classList.remove("on")); b.classList.add("on");
    curCSide=b.dataset.cside; renderChecklist();
  }));
  $("#add-item-btn").addEventListener("click",async()=>{
    const item=await promptModal({title:"Add checklist item",label:"Task",okText:"Add"}); if(!item) return;
    const maxOrder=Math.max(0,...checklist.filter(c=>c.side===curCSide).map(c=>c.sort_order||0));
    const {error}=await sb.from("wedding_checklist").insert({side:curCSide,item,completed:false,sort_order:maxOrder+1});
    if(error){ showToast("Error: "+error.message); return; }
    showToast("Item added"); loadChecklist();
  });
  $("#checklist-items").addEventListener("click",async e=>{
    const row=e.target.closest(".check-row"); if(!row) return;
    const id=row.dataset.id, c=checklist.find(x=>String(x.id)===String(id)); if(!c) return;
    if(e.target.type==="checkbox"){
      const completed=e.target.checked;
      const {error}=await sb.from("wedding_checklist").update({completed,updated_at:new Date()}).eq("id",id);
      if(error){ showToast("Error: "+error.message); e.target.checked=!completed; return; }
      c.completed=completed; renderChecklist();
    }
    if(e.target.classList.contains("del")){
      const ok=await confirmModal({title:"Remove item?",sub:c.item,okText:"Remove"}); if(!ok) return;
      const {error}=await sb.from("wedding_checklist").delete().eq("id",id);
      if(error){ showToast("Error: "+error.message); return; }
      showToast("Removed"); loadChecklist();
    }
  });

  /* ---------- RSVPS ---------- */
  async function loadRsvps(){
    const {data,error}=await sb.from("rsvps").select("*").order("created_at",{ascending:false});
    if(error){ $("#rsvp-summary").innerHTML=""; $("#rsvp-list").innerHTML=`<div class="empty">Couldn't load RSVPs: ${esc(error.message)}.<br>You may need to add a read policy — see README.md.</div>`; return; }
    rsvps=data||[]; renderRsvps();
  }
  function renderRsvps(){
    if(!rsvps.length){ $("#rsvp-summary").innerHTML=""; $("#rsvp-list").innerHTML=`<div class="empty">No RSVPs yet.</div>`; return; }
    const yes=rsvps.filter(r=>r.attending), no=rsvps.filter(r=>!r.attending);
    $("#rsvp-summary").innerHTML=`
      <div class="rstat"><div class="n">${yes.length}</div><div class="l">Accepting</div></div>
      <div class="rstat"><div class="n">${no.length}</div><div class="l">Declining</div></div>
      <div class="rstat"><div class="n">${rsvps.length}</div><div class="l">Responses</div></div>`;
    $("#rsvp-list").innerHTML=rsvps.map(r=>`
      <div class="rsvp-item ${r.attending?'yes':'no'}">
        <div class="ri-main"><span class="ri-name">${esc(r.name)}</span><span class="ri-badge">${r.attending?'Attending':'Declined'}</span></div>
        <div class="ri-meta">
          ${r.side?`<span>${r.side==='groom'?"Ryan's side":"Debbie's side"}</span>`:''}
          ${r.email?`<span>&#9993; ${esc(r.email)}</span>`:''}
        </div>
        ${r.message?`<div class="ri-msg">&ldquo;${esc(r.message)}&rdquo;</div>`:''}
      </div>`).join("");
  }

  /* ---------- REALTIME ---------- */
  let subbed=false;
  function subscribeRealtime(){
    if(subbed||!sb.channel) return; subbed=true;
    try{
      sb.channel("rd-dash")
        .on("postgres_changes",{event:"*",schema:"public",table:"guests"},loadGuests)
        .on("postgres_changes",{event:"*",schema:"public",table:"wedding_checklist"},loadChecklist)
        .on("postgres_changes",{event:"*",schema:"public",table:"rsvps"},loadRsvps)
        .subscribe();
    }catch(e){ console.warn("Realtime unavailable",e); }
  }

  /* ---------- EXPORT ---------- */
  $("#export-btn").addEventListener("click",()=>{
    if(!window.XLSX||!guests.length){ showToast("Nothing to export yet"); return; }
    const rows=guests.map(g=>({Name:g.name,Side:g.guest_side==="groom"?"Ryan":"Debbie",Category:g.category}));
    const ws=XLSX.utils.json_to_sheet(rows), wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb,ws,"Guests");
    XLSX.writeFile(wb,`RyanAndDebbie-GuestList-${new Date().toISOString().slice(0,10)}.xlsx`);
  });
})();
</script>
</body>
</html>
